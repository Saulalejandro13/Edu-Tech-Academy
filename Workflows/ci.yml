name: EduTech CI
on:
  push:
  pull_request:
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - run: pytest
      - run: docker compose config
      - run: docker build -t edutech-pia .
